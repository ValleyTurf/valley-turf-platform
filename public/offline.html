<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174734" />
    <title>You're offline — Valley Turf Revival OS</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f4ef;
        color: #174734;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        padding: 24px;
      }

      main {
        max-width: 420px;
        text-align: center;
      }

      .badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #9c7a20;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 28px;
        margin: 0 0 12px;
      }

      p {
        color: #6b705c;
        line-height: 1.5;
        margin: 0 0 24px;
      }

      button {
        appearance: none;
        border: none;
        background: #174734;
        color: white;
        font-weight: 700;
        font-size: 15px;
        padding: 14px 28px;
        border-radius: 12px;
        cursor: pointer;
      }

      button:hover {
        background: #226246;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="badge">Valley Turf Revival OS</p>
      <h1>You're offline</h1>
      <p>
        This page needs a connection to load job, customer, and revenue
        data. Reconnect and try again — nothing was lost.
      </p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
